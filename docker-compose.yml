version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"   # bind to localhost only — nginx is the public face
    volumes:
      - ./data:/app/data         # persist SQLite DB for local dev
    environment:
      # Use absolute in-container path (4-slash = absolute with SQLite)
      - DATABASE_URL=sqlite:////app/data/itsp.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "0.0.0.0:3000:80"
    depends_on:
      backend:
        condition: service_healthy   # wait for backend health check to pass
    restart: unless-stopped
