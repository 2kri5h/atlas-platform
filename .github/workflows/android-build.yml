name: Build Android App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        env:
          VITE_API_URL: https://atlas-platform-51gn.onrender.com
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release Bundle (AAB)
        working-directory: frontend/android
        run: ./gradlew bundleRelease --stacktrace
        continue-on-error: true

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: atlas-release-bundle
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
