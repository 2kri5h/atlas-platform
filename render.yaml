services:
  # Daily deadline-reminder email sweep (08:00 UTC). Requires CRON_SECRET +
  # SMTP_* env vars on the backend service for actual email delivery.
  - type: cron
    name: itsp-reminders-cron
    runtime: python
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: >
      sh -c "curl -sf -X POST ${RENDER_EXTERNAL_URL}/api/internal/cron/reminders
      -H 'X-Cron-Secret: ${CRON_SECRET}' || echo 'reminder sweep failed'"
    envVars:
      - key: CRON_SECRET
        sync: false

  - type: web
    name: itsp-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python init_db.py

    startCommand: gunicorn backend.api.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_KRISH
        sync: false
      - key: GEMINI_API_KEY_ATHARVA
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./data/itsp.db
      - key: AUTO_SEED_ON_STARTUP
        value: "true"
      # Must be an explicit comma-separated origin list in production.
      # Wildcard CORS with credentials is rejected by browsers and unsafe.
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: "production"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
